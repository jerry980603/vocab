<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>單字練習</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1d23; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-soft:#eff6ff;
  --ok:#059669; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
  --warn:#d97706;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161a; --card:#1e2127; --text:#e8eaed; --sub:#9aa0a6; --line:#2e323a;
    --accent:#60a5fa; --accent-soft:#1c2b45;
    --ok:#34d399; --ok-soft:#13291f; --bad:#f87171; --bad-soft:#331a1a;
    --warn:#fbbf24;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.65;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}

/* ---------- 版面 ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.02em}
.daily{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
main{padding:16px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ---------- 底部導覽 ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:grid;grid-template-columns:repeat(7,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  padding:9px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;color:var(--sub);white-space:nowrap;
}
nav button .ic{width:21px;height:21px;display:block;stroke:currentColor}
nav button.on{color:var(--accent);font-weight:600}
nav .badge{
  position:absolute;transform:translate(16px,-4px);
  background:var(--bad);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;padding:0 4px;border-radius:8px;line-height:16px;text-align:center;
}

/* ---------- 通用元件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.btn{
  display:block;width:100%;padding:14px;border-radius:11px;
  background:var(--accent);color:#fff;font-weight:600;font-size:16px;text-align:center;
}
/* 答題卡上的送出鈕刻意做小一號：真正要動作的是上面的輸入框，
   一顆整寬的飽和藍按鈕會把視線從輸入框搶走。 */
#btnGo{padding:12px;font-size:15px;border-radius:10px}
.btn:active{opacity:.82}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;display:inline-block}
.row{display:flex;gap:10px}
.row>*{flex:1}
.empty{text-align:center;color:var(--sub);padding:48px 20px;font-size:15px}
.empty .big{font-size:42px;display:block;margin-bottom:14px;opacity:.55}
.tag{
  display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;
  background:var(--accent-soft);color:var(--accent);
}
.tag.gray{background:var(--line);color:var(--sub)}
.lv{
  display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;
  vertical-align:2px;background:var(--line);color:var(--sub);
}
.lv.l1,.lv.l2{background:#dcfce7;color:#15803d}
.lv.l3,.lv.l4{background:#dbeafe;color:#1d4ed8}
.lv.l5,.lv.l6{background:#fef3c7;color:#b45309}
.lv.out{background:#fee2e2;color:#b91c1c}
@media (prefers-color-scheme:dark){
  .lv.l1,.lv.l2{background:#14311f;color:#4ade80}
  .lv.l3,.lv.l4{background:#16294a;color:#7dabf8}
  .lv.l5,.lv.l6{background:#3a2a08;color:#fbbf24}
  .lv.out{background:#3b1616;color:#fca5a5}
}
h2.sec{font-size:13px;color:var(--sub);font-weight:600;margin:26px 0 10px;letter-spacing:.04em}
h2.sec:first-child{margin-top:0}

/* ---------- 練習卡 ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:var(--sub)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;display:block;
  background:transparent;border:1.5px solid var(--line)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.zhline{font-size:17px;font-weight:500;margin:0 0 16px;line-height:1.75}
.enline{
  font-size:19px;line-height:1.95;margin:0 0 16px;
  font-family:ui-rounded,"Segoe UI",-apple-system,sans-serif;
}
.enline .tk{border-radius:4px;padding:1px 1px;cursor:pointer}
.enline .tk:active{background:var(--accent-soft)}
.blank{
  display:inline-block;min-width:58px;text-align:center;white-space:nowrap;
  border-bottom:2.5px solid var(--accent);color:var(--accent);font-weight:700;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.26em;padding:0 4px 0 8px;
}
/* 答案有幾個字母——這是分辨 trash(5) 與 garbage(7) 這種同義詞的唯一線索，
   光看底線數不出來，所以直接標一個小數字。 */
.blank .bn{
  font-family:system-ui,sans-serif;font-style:normal;font-size:11px;font-weight:600;
  letter-spacing:0;vertical-align:super;opacity:.55;margin-left:1px;
}
.blank.rev{border-color:var(--ok);color:var(--ok)}
.hintbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;font-size:14px;color:var(--sub)}
.hintbar .zh{color:var(--text);font-weight:500}
.posmask{
  cursor:pointer;user-select:none;color:var(--sub);
  border:1px dashed var(--line);border-radius:9px;padding:5px 11px
}
.posmask:active{background:var(--accent-soft);border-color:var(--accent)}
/* 快捷鍵標籤：只在有實體鍵盤的裝置顯示，手機上藏起來免得占空間 */
.kbd{display:none}
@media (hover:hover) and (pointer:fine){
  .kbd{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
    font-size:11px;font-weight:600;line-height:16px;vertical-align:1px;
    background:var(--line);color:var(--sub);font-family:ui-monospace,Menlo,Consolas,monospace;
  }
}
.inwrap{display:flex;align-items:stretch;gap:8px}
.inwrap #ansIn{flex:1}
.sfx{
  display:flex;align-items:center;padding:0 15px;border-radius:11px;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:19px;
  border:2px dashed var(--accent);white-space:nowrap;
}
#ansIn{
  width:100%;padding:16px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--text);font-size:21px;letter-spacing:.02em;
  outline:none;text-align:center;font-weight:600;
  border-color:color-mix(in srgb, var(--accent) 34%, var(--line));
  transition:border-color .12s,box-shadow .12s;
}
#ansIn::placeholder{font-size:15px;font-weight:500;color:var(--sub);letter-spacing:0}
/* 對焦時給一圈光暈：讓「要打字的地方」比「送出」那顆藍色按鈕更搶眼，
   原本的層級是反的——最顯眼的是按鈕，但真正要動作的是這裡。 */
#ansIn:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
#ansIn.ok{border-color:var(--ok);background:var(--ok-soft)}
#ansIn.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:16px;padding:14px;border-radius:11px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{font-size:19px;letter-spacing:.02em}
.zhline.masked{
  font-size:15px;font-weight:400;color:var(--sub);cursor:pointer;user-select:none;
  border:1px dashed var(--line);border-radius:10px;padding:10px 12px;text-align:center
}
.zhline.masked:active{background:var(--accent-soft);border-color:var(--accent)}
.alleg{margin-top:14px}
.alleg .egsense{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
.alleg .egsense:first-child{border-top:0;padding-top:0;margin-top:0}
.alleg .eghd{margin-bottom:7px}
.alleg .eghd .zh{font-weight:600;font-size:15px;color:var(--text)}
.alleg .eg{font-size:14px;line-height:1.75;margin-bottom:9px;
  padding-left:10px;border-left:2px solid var(--line)}
.alleg .eg.now{border-left-color:var(--accent);background:var(--accent-soft);
  border-radius:0 8px 8px 0;padding:6px 9px 6px 10px}
.alleg .eg .en{color:var(--text)}
.alleg .eg .en em{font-style:normal;font-weight:700;color:var(--accent)}
.alleg .eg .zh{color:var(--sub);margin-top:2px}
.alleg .eg .tk{border-radius:4px;padding:1px 1px;cursor:pointer}
.alleg .eg .tk:active{background:var(--accent-soft)}
.minilink{font-size:13px;color:var(--sub);text-decoration:underline;padding:6px 0}

/* ---------- 查單字 ---------- */
#searchIn{
  width:100%;padding:13px 16px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--text);outline:none;
}
#searchIn:focus{border-color:var(--accent)}
.hit{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;
}
.hit .w{font-weight:650;font-size:17px}
.hit .m{font-size:13px;color:var(--sub);margin-top:1px}
.hit .arrow{color:var(--sub);font-size:15px}
.sense{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px;background:var(--card)}
.sense .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.sense .zh{font-weight:600;font-size:16px}
.sense .ex{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.7}
.sense .ex em{font-style:normal;font-weight:700;color:var(--text)}
.addbtn{padding:7px 14px;border-radius:20px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.addbtn.done{background:var(--line);color:var(--sub)}

/* ---------- 我的字 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li .w{font-weight:600}
.li .m{font-size:13px;color:var(--sub)}
.li .del{color:var(--sub);font-size:19px;padding:4px 8px}

/* ---------- 單字卡 ---------- */
.flash{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 20px;text-align:center;box-shadow:var(--shadow);cursor:pointer;
}
.flash .fw{font-size:32px;font-weight:700;letter-spacing:.01em}
.flash .fp{color:var(--sub);font-size:14px;margin-top:6px}
.flash .fz{font-size:20px;font-weight:600;margin:4px 0 14px}
.flash .fe{font-size:14px;color:var(--sub);line-height:1.8}
.flash .fe em{font-style:normal;font-weight:700;color:var(--text)}
.flash .tip{color:var(--sub);font-size:12px;margin-top:18px}

/* ---------- 底部彈出 ---------- */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#sheetBg.on{display:block}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--card);border-radius:18px 18px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:78vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;
  max-width:640px;margin:0 auto;
}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 16px}
#sheet h3{margin:0 0 4px;font-size:23px}
#sheet .sub{color:var(--sub);font-size:13px;margin-bottom:16px}

/* ---------- 課表 ---------- */
.plan-head{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.plan-head .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.plan-head .cap{font-size:13px;color:var(--sub)}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.day{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:13px 15px;margin-bottom:9px;cursor:pointer;
}
.day .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.day .n{font-weight:650}
.day .st{font-size:12px;color:var(--sub);white-space:nowrap}
.day.done{border-color:var(--ok)}
.day.done .n::after{content:" ✓";color:var(--ok)}
.day .words{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.8;display:none}
.day.open .words{display:block}
.day .words b{color:var(--text);font-weight:600}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{
  flex:1;padding:11px 6px;font-size:14px;color:var(--sub);background:var(--card);
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.num{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);outline:none;text-align:center;font-size:17px;font-weight:600;
}

/* ---------- 學習紀錄 ---------- */
.crow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.crow .d{width:66px;font-size:12px;color:var(--sub);white-space:nowrap}
.crow .v{width:38px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--sub)}
.crow.now .d,.crow.now .v{color:var(--accent);font-weight:600}
.logtb{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.logtb th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.logtb td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.logtb th:first-child,.logtb td:first-child{text-align:left}
.logtb tr.now td{color:var(--accent);font-weight:600}

/* ---------- 設定 ---------- */
.setrow{padding:15px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.setrow .t{font-weight:500}
.setrow .d{font-size:13px;color:var(--sub);margin-top:2px}
textarea.io{
  width:100%;height:130px;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  outline:none;resize:vertical;
}
/* 同步用的 token 輸入框。字型跟 .io 一樣用等寬，貼上長字串比較好認。 */
input.tokin{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;
}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:22px;
  font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:88vw;text-align:center;
}
.toast.on{opacity:.95}
</style>
</head>
<body>

<header>
  <h1 id="title">練習</h1>
  <div class="daily" id="daily"></div>
</header>

<main>
  <section class="view on" id="v-drill"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-stat"></section>
  <section class="view" id="v-find"></section>
  <section class="view" id="v-mine"></section>
  <section class="view" id="v-wrong"></section>
  <section class="view" id="v-set"></section>
</main>

<nav id="nav">
  <button data-v="drill" class="on"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="M14 6l4 4"/></svg>練習</button>
  <button data-v="plan"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>課表</button>
  <button data-v="stat"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>紀錄</button>
  <button data-v="find"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>查單字</button>
  <button data-v="mine"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v14H5.5A1.5 1.5 0 0 0 4 18.5v-14Z"/><path d="M4 18.5A1.5 1.5 0 0 1 5.5 17H19v4H5.5A1.5 1.5 0 0 1 4 19.5v-1Z"/><path d="M8 7h7"/></svg>我的字</button>
  <button data-v="wrong"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="15" rx="1.8"/><path d="M8 3h11a1.8 1.8 0 0 1 1.8 1.8V17"/><path d="M7 12l2.6 2.6L13 10.5"/></svg>錯題本</button>
  <button data-v="set"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.1"/><circle cx="9" cy="17" r="2.1"/></svg>設定</button>
</nav>

<div id="sheetBg"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="data/bank.js"></script>
<script src="data/w1.js"></script>
<script src="data/w2.js"></script>
<script src="data/w3.js"></script>
<script src="data/w4.js"></script>
<script src="data/w5.js"></script>
<script src="data/w6.js"></script>
<script src="data/w7.js"></script>
<script src="data/w8.js"></script>
<script src="data/w9.js"></script>
<script src="data/w10.js"></script>
<script src="data/w11.js"></script>
